<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio Adicional MEDIO</title>
    <link rel="stylesheet" href="./css/style.css">
    <script defer src="./js/app.js"></script>
</head>

<body>
    <main class="contenedor">
        <h1>Presupuesto con porcentajes personalizados</h1>

        <label for="ingresos">Monto de ingresos:</label>
        <input type="number" id="ingresos">

        <h2>Porcentajes</h2>

        <label for="porcentajeNecesarios">Gastos necesarios (%):</label>
        <input type="number" id="porcentajeNecesarios">

        <label for="porcentajePersonales">Gastos personales (%):</label>
        <input type="number" id="porcentajePersonales">

        <label for="porcentajeAhorro">Ahorro (%):</label>
        <input type="number" id="porcentajeAhorro">

        <button id="btnCalcular">Calcular presupuesto</button>

        <section class="resultados">
            <p id="resultadoNecesarios"></p>
            <p id="resultadoPersonales"></p>
            <p id="resultadoAhorro"></p>
            <p id="mensaje"></p>
        </section>
    </main>
</body>
</html>
