<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio Adicional AVANZADO</title>
    <link rel="stylesheet" href="./css/style.css">
    <script defer src="./js/app.js"></script>
</head>

<body>
    <main class="contenedor">
        <h1>Presupuesto con categorías personalizadas</h1>

        <label for="ingresos">Monto de ingresos:</label>
        <input type="number" id="ingresos">

        <h2>Agregar categoría</h2>

        <label for="nombreCategoria">Nombre de la categoría:</label>
        <input type="text" id="nombreCategoria">

        <label for="porcentajeCategoria">Porcentaje destinado:</label>
        <input type="number" id="porcentajeCategoria">

        <button id="btnAgregar">Agregar categoría</button>

        <h2>Categorías agregadas</h2>
        <ul id="listaCategorias"></ul>

        <button id="btnCalcular">Calcular presupuesto</button>

        <section id="resultado"></section>

        <p id="mensaje"></p>
    </main>
</body>
</html>
